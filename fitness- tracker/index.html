<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fitness Tracker</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>🏃 Fitness Tracker</h1>
        <p>Track your daily fitness progress</p>
      </header>

      <!-- Daily Summary -->

      <section class="summary">
        <div class="summary-card">
          <h3>Steps</h3>
          <p id="stepsDisplay">0</p>
          <span>steps</span>
        </div>

        <div class="summary-card">
          <h3>Workout</h3>
          <p id="workoutDisplay">0</p>
          <span>minutes</span>
        </div>

        <div class="summary-card">
          <h3>Calories</h3>
          <p id="caloriesDisplay">0</p>
          <span>kcal</span>
        </div>
      </section>

      <!-- Add Fitness Data -->

      <section class="form-section">
        <h2>Log Today's Activity</h2>

        <form id="fitnessForm">
          <label for="steps">Steps</label>
          <input
            type="number"
            id="steps"
            placeholder="Enter steps"
            min="0"
            required
          />

          <label for="workout">Workout Time (minutes)</label>
          <input
            type="number"
            id="workout"
            placeholder="Enter workout minutes"
            min="0"
            required
          />

          <label for="calories">Calories Burned</label>
          <input
            type="number"
            id="calories"
            placeholder="Enter calories"
            min="0"
            required
          />

          <button type="submit">Add Activity</button>
        </form>
      </section>

      <!-- Progress -->

      <section class="progress-section">
        <h2>Today's Progress</h2>

        <div class="progress-item">
          <div class="progress-label">
            <span>Steps Goal</span>
            <span id="stepsProgressText">0%</span>
          </div>

          <div class="progress-bar">
            <div id="stepsProgress" class="progress-fill"></div>
          </div>
        </div>

        <div class="progress-item">
          <div class="progress-label">
            <span>Workout Goal</span>
            <span id="workoutProgressText">0%</span>
          </div>

          <div class="progress-bar">
            <div id="workoutProgress" class="progress-fill"></div>
          </div>
        </div>

        <div class="progress-item">
          <div class="progress-label">
            <span>Calories Goal</span>
            <span id="caloriesProgressText">0%</span>
          </div>

          <div class="progress-bar">
            <div id="caloriesProgress" class="progress-fill"></div>
          </div>
        </div>
      </section>

      <!-- Activity History -->

      <section class="history-section">
        <h2>Activity History</h2>

        <div id="history"></div>

        <button id="clearButton" class="clear-btn">Clear All Data</button>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
